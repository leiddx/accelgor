[project]
name = "accelgor"
version = "0.1.0"
description = "FastAPI + Tortoise ORM Web 应用"
authors = [
    { name = "leiddx", email = "leiddx@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "tortoise-orm[asyncmy]>=1.1.7",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
