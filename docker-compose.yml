services:
  mysql:
    image: mysql:8.0
    container_name: accelgor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: accelgor
      MYSQL_USER: accelgor
      MYSQL_PASSWORD: accelgor
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
